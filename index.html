<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A-Level PE — Programme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
<style>
:root{--paper:#EEF1F2;--card:#FFFFFF;--ink:#172029;--muted:#5F6E79;--line:#E3E7EA;--steel:#3E7CB1;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:720px;margin:0 auto;padding:16px;}
.topbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:14px;}
.crest{color:var(--ink);}.dot{width:3px;height:3px;border-radius:50%;background:var(--muted);}
.spacer{flex:1;}.saved{color:#1C8C63;font-weight:700;font-size:12px;}
.roles{display:flex;gap:3px;background:#E3E7EA;border-radius:9px;padding:3px;}
.roles button{border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 14px;border-radius:7px;cursor:pointer;}
.roles button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring-c{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;}
.ring-v{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:17px;}
.ring-s{font-size:9px;color:var(--muted);font-weight:600;margin-top:1px;}
.hero{background:linear-gradient(135deg,#141C24,#1F2C36);color:#EDF1F3;border-radius:16px;padding:22px;margin-bottom:12px;}
.hh-name{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:15px;color:#8FA3B0;margin-bottom:4px;}
.hh-line{font-size:18px;font-weight:500;}.hh-line strong{font-family:'Archivo Expanded',sans-serif;font-weight:800;}.star{color:#7FD3AD;}
.gradebar{margin:18px 0 2px;}.gb-track{position:relative;height:12px;background:rgba(255,255,255,.12);border-radius:6px;}
.gb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#3E7CB1,#5FA8D8);transition:width .5s;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
.card-h{font-weight:700;font-size:15px;margin-bottom:14px;}
.aob{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.aob-tag{font-family:'Archivo Expanded',sans-serif;font-weight:700;font-size:11px;padding:3px 8px;border-radius:5px;width:44px;text-align:center;}
.aob-lab{font-size:12.5px;font-weight:600;color:var(--muted);width:82px;}
.aob-bar{flex:1;height:9px;background:#EDF0F2;border-radius:5px;overflow:hidden;}.aob-bar > div{height:100%;border-radius:5px;transition:width .5s;}
.aob-v{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:14px;width:24px;text-align:right;}
.await{font-size:13px;color:var(--muted);background:#F7F9FA;border-radius:9px;padding:12px;}
.mk-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px;}
.mk-row strong{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:16px;}
.mk-row.hi{background:#FBEDB0;margin:0 -10px;padding:8px 10px;border-radius:8px;}
.refl p{font-size:12.5px;margin:0 0 8px;}
.refl textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;}
.refl textarea:focus{outline:none;border-color:var(--steel);}
.refl button{margin-top:8px;border:0;background:var(--ink);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;}
.refl-done{font-size:12.5px;line-height:1.5;background:#F1F6F4;border:1px solid #D3E4DC;border-radius:9px;padding:12px;color:#15694A;}
.arow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
.arow:first-of-type{border-top:0;}
.arow-mid{flex:1;}.arow-name{font-size:14px;font-weight:700;}.arow-ao{font-size:11.5px;color:var(--muted);margin-top:2px;}
.revise{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.revise a{font-size:11.5px;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:7px;border:1px solid;}
.rev-short{color:#2E6C9E;border-color:#CBE3F5;background:#F3F8FC;}
.rev-ext{color:#9A7A16;border-color:#F0E2A8;background:#FCF7E3;}
.cls{background:#141C24;color:#EDF1F3;border-radius:14px;padding:18px;display:flex;align-items:center;gap:20px;margin-bottom:12px;}
.cls-item{display:flex;flex-direction:column;align-items:center;gap:6px;}.cls-l{font-size:11px;color:#8FA3B0;font-weight:600;}
.cls-stats{display:flex;flex:1;justify-content:space-around;}.cls-s{text-align:center;}
.cls-s strong{display:block;font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:24px;}.cls-s span{font-size:11px;color:#8FA3B0;font-weight:600;}
.crow{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);}.crow:first-of-type{border-top:0;}
.crow-b{flex:1;}.crow-id{font-size:13.5px;font-weight:700;}.crow-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.crow-state{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lane{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.lane.own{border-color:#CBE3F5;}
.lane-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.lane-tag{font-family:'Archivo Expanded',sans-serif;font-weight:700;font-size:11px;padding:4px 10px;border-radius:6px;}
.lane-w{font-size:11.5px;color:var(--muted);font-weight:600;}
.stream{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;}
.s-code{font-weight:700;}.s-piece{flex:1;color:var(--muted);}.s-res{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:12px;}
.empty{font-size:12.5px;color:var(--muted);}
.queue-item{padding:10px 0;border-top:1px solid var(--line);}
.qi-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.qi-who{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:13px;}.qi-q{font-size:12px;color:var(--muted);}
.qi-btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;}
.qi-pred{font-size:12px;color:var(--muted);margin-bottom:10px;}
.levels{display:flex;gap:8px;margin-bottom:12px;}
.lvl{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.lvl.on{border-color:var(--ink);background:#FBEDB0;}
.lvl-l{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:15px;}.lvl-m{font-size:11px;color:var(--muted);font-weight:700;}
.save{width:100%;border:0;background:#1C8C63;color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:11px;border-radius:9px;cursor:pointer;}
.save:disabled{opacity:.45;}
.field{margin-bottom:12px;}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:#EDF0F2;border:0;border-radius:16px;padding:6px 12px;cursor:pointer;font-family:inherit;}
.chip.on{background:var(--ink);color:#fff;}.chip.lv{width:50px;text-align:center;font-family:'Archivo Expanded',sans-serif;font-weight:800;}
.field input{border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;width:100%;}
.field input:focus{outline:none;border-color:var(--steel);}
.seg{display:inline-flex;background:#E3E7EA;border-radius:9px;padding:3px;}
.seg button{border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 16px;border-radius:7px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--ink);}
.markrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted);}.mnum{width:80px !important;}
.ownlog{margin-top:14px;}
.ol{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-top:1px solid var(--line);}
.ol span:first-child{font-weight:700;}.ol span{color:var(--muted);}
.loading{padding:40px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
/* ---------- config ---------- */
var BASEURL = "https://tomeisenhuth-arch.github.io/Revision-2026/";
var AREAS = [
  { key:"skill", name:"Skill Acquisition", short:BASEURL+"SkillAcquisitionEC.html", ext:BASEURL+"SkillAcquisitionExtended%20(1).html" },
  { key:"psych", name:"Sport Psychology", short:BASEURL+"SportPsychologyEC.html", ext:BASEURL+"SportPsychologyExtended.html" },
  { key:"physbio", name:"Physiology & Biomechanics", short:BASEURL+"PhysiologyBiomechanicsEC.html", ext:BASEURL+"PhysiologyExtended.html" },
  { key:"socio", name:"Sociology of Sport", short:BASEURL+"SociologyEC.html", ext:BASEURL+"SociologyExtended.html" }
];
function areaName(k){ for(var i=0;i<AREAS.length;i++){ if(AREAS[i].key===k) return AREAS[i].name; } return k; }
var PINK={hi:"#FBD0E0",sol:"#CF5E8C",txt:"#B0396A"}, BLUE={hi:"#CBE3F5",sol:"#4E8FC0",txt:"#2E6C9E"}, YEL={hi:"#FBEDB0",sol:"#D6A82A",txt:"#9A7A16"};
var GREEN="#1C8C63",AMBER="#C58A1E",RED="#C0463E",INK="#172029";
var LVL={L1:28,L2:48,L3:64,L4:86};
var WEIGHT={high:0.6,ownLevel:0.4,ownMark:0.3};
function stcol(v){ return v>=73?GREEN:(v>=60?AMBER:RED); }
function clamp(v){ return Math.max(20,Math.min(96,Math.round(v))); }
function blend(o,val,w){ return clamp(o*(1-w)+val*w); }
function mean(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
function areaPct(a){ return Math.round(mean(a)); }
function overall(s){ var v=AREAS.map(function(a){return areaPct(s.areas[a.key]);}); return Math.round(mean(v)); }
function aoOverall(s,i){ var v=AREAS.map(function(a){return s.areas[a.key][i];}); return Math.round(mean(v)); }

/* ---------- seed ---------- */
function mk(base,d){ var o={}; for(var k in base){ o[k]=base[k].map(function(v){return clamp(v+d);}); } return o; }
var B={ skill:[88,79,62], psych:[90,74,57], physbio:[68,60,47], socio:[80,66,56] };
var SEED={
  focus:"callum",
  students:[
    { id:"callum", name:"Callum", cls:"13A", target:"A*", areas:mk(B,0),
      marks:[{id:"h1",area:"psych",q:"Mock Paper 2 · Sport psychology",predicted:"L2",awarded:null,reflection:""}] },
    { id:"jayden", name:"Jayden", cls:"13A", target:"B", areas:mk(B,-16),
      marks:[{id:"h2",area:"physbio",q:"Mock Paper 2 · Physiology & biomechanics",predicted:"L1",awarded:null,reflection:""}] },
    { id:"ella", name:"Ella", cls:"13A", target:"A", areas:mk(B,-6), marks:[] },
    { id:"amara", name:"Amara", cls:"13A", target:"A*", areas:mk(B,8), marks:[] }
  ],
  own:[],
  ai:[
    { name:"Callum", piece:"Sport psychology · short answer", res:"AO1 79%" },
    { name:"Ella", piece:"Skill acquisition · extended 8-marker", res:"L3" },
    { name:"Jayden", piece:"Physiology · short answer", res:"AO1 61%" }
  ]
};

/* ---------- state + storage ---------- */
var KEY="pe-app-v4";
var state=null, tab="me", flash=false;
var pickMark=null, pickLevel=null;
var form={ stu:"callum", area:"physbio", name:"", mode:"level", level:null, mark:"", out:"15" };

function load(){ try{ var v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function commit(){ save(); flash=true; render(); setTimeout(function(){ flash=false; render(); },1200); }
function focusStu(){ for(var i=0;i<state.students.length;i++){ if(state.students[i].id===state.focus) return state.students[i]; } }
function pending(){ var out=[]; state.students.forEach(function(s){ s.marks.forEach(function(m){ if(!m.awarded) out.push({m:m,s:s}); }); }); return out; }

/* ---------- ring ---------- */
function ring(pct,size,stroke,sub){
  var r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100), col=stcol(pct);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'
    +'<svg width="'+size+'" height="'+size+'">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#EAEEF0" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset .5s"/>'
    +'</svg><div class="ring-c"><span class="ring-v">'+pct+'</span>'+(sub?'<span class="ring-s">'+sub+'</span>':'')+'</div></div>';
}

/* ---------- actions ---------- */
function setTab(t){ tab=t; render(); }
function openMark(id){ pickMark=id; pickLevel=null; render(); }
function setLevel(l){ pickLevel=l; render(); }
function award(){
  if(!pickMark||!pickLevel) return;
  var p=pending();
  for(var i=0;i<p.length;i++){ if(p[i].m.id===pickMark){
    p[i].m.awarded=pickLevel;
    var a=p[i].s.areas[p[i].m.area]; a[2]=blend(a[2],LVL[pickLevel],WEIGHT.high);
  }}
  pickMark=null; pickLevel=null; commit();
}
function saveRefl(id){
  var el=document.getElementById("reflInput"); var val=el?el.value:"";
  var s=focusStu(); for(var i=0;i<s.marks.length;i++){ if(s.marks[i].id===id) s.marks[i].reflection=val; }
  commit();
}
function ownField(k,v){ form[k]=v; }
function setOwn(k,v){ form[k]=v; render(); }
function saveOwn(){
  var nEl=document.getElementById("oName"); if(nEl) form.name=nEl.value;
  var mEl=document.getElementById("oMark"); if(mEl) form.mark=mEl.value;
  var oEl=document.getElementById("oOut"); if(oEl) form.out=oEl.value;
  if(!form.name.trim() || (form.mode==="level"?!form.level:form.mark==="")) return;
  var stu=null; for(var i=0;i<state.students.length;i++){ if(state.students[i].id===form.stu) stu=state.students[i]; }
  var a=stu.areas[form.area];
  if(form.mode==="level"){ a[2]=blend(a[2],LVL[form.level],WEIGHT.ownLevel); }
  else { var pct=clamp((+form.mark/+form.out)*100); a[0]=blend(a[0],pct,WEIGHT.ownMark); a[1]=blend(a[1],pct,WEIGHT.ownMark); a[2]=blend(a[2],pct,WEIGHT.ownMark); }
  state.own.unshift({ name:stu.name, area:form.area, title:form.name.trim(), score:form.mode==="level"?form.level:(form.mark+"/"+form.out) });
  form.name=""; form.level=null; form.mark="";
  commit();
}

/* ---------- render ---------- */
function render(){
  if(!state){ document.getElementById("app").innerHTML='<div class="loading">Loading…</div>'; return; }
  var h="";
  h+='<div class="topbar"><span class="crest">Elizabeth College</span><span class="dot"></span><span>A-Level PE</span><span class="spacer"></span>'
    +(flash?'<span class="saved">Saved &#10003;</span>':'')
    +'<div class="roles">'
    +'<button class="'+(tab==="me"?"on":"")+'" onclick="setTab(\'me\')">Me</button>'
    +'<button class="'+(tab==="class"?"on":"")+'" onclick="setTab(\'class\')">Class</button>'
    +'<button class="'+(tab==="mark"?"on":"")+'" onclick="setTab(\'mark\')">Mark</button>'
    +'</div></div>';
  if(tab==="me") h+=viewMe();
  else if(tab==="class") h+=viewClass();
  else h+=viewMark();
  document.getElementById("app").innerHTML=h;
}

function viewMe(){
  var f=focusStu(); var h="";
  h+='<div class="hero"><div class="hh-name">'+f.name+' &middot; '+f.cls+'</div>'
    +'<div class="hh-line">Tracking to <strong class="star">'+f.target+'</strong> &middot; overall '+overall(f)+'%</div>'
    +'<div class="gradebar"><div class="gb-track"><div class="gb-fill" style="width:'+overall(f)+'%"></div></div></div></div>';
  var aos=[["AO1","Knowledge",PINK,0],["AO2","Application",BLUE,1],["AO3","Evaluation",YEL,2]];
  h+='<div class="card"><div class="card-h">Your three objectives</div>';
  aos.forEach(function(a){
    h+='<div class="aob"><span class="aob-tag" style="background:'+a[2].hi+';color:'+a[2].txt+'">'+a[0]+'</span>'
      +'<span class="aob-lab">'+a[1]+'</span>'
      +'<div class="aob-bar"><div style="width:'+aoOverall(f,a[3])+'%;background:'+a[2].sol+'"></div></div>'
      +'<span class="aob-v">'+aoOverall(f,a[3])+'</span></div>';
  });
  h+='</div>';
  f.marks.forEach(function(m){
    h+='<div class="card"><div class="card-h">'+m.q+'</div>';
    if(!m.awarded){ h+='<div class="await">You predicted <strong>'+m.predicted+'</strong> &mdash; awaiting your teacher&rsquo;s mark.</div>'; }
    else{
      h+='<div class="mk-row"><span>You predicted</span><strong>'+m.predicted+'</strong></div>'
        +'<div class="mk-row hi"><span>Marked by teacher</span><strong>'+m.awarded+'</strong></div>';
      if(m.reflection){ h+='<div class="refl-done"><strong>Your reflection:</strong> '+m.reflection+'</div>'; }
      else{ h+='<div class="refl"><p>What will you change to get more yellow next time?</p>'
        +'<textarea id="reflInput" rows="2" placeholder="Next time I will&hellip;"></textarea>'
        +'<button onclick="saveRefl(\''+m.id+'\')">Save reflection</button></div>'; }
    }
    h+='</div>';
  });
  h+='<div class="card"><div class="card-h">Your four areas &middot; tap a tutor to revise</div>';
  AREAS.forEach(function(a){
    var pct=areaPct(f.areas[a.key]);
    h+='<div class="arow">'+ring(pct,58,7,"%")
      +'<div class="arow-mid"><div class="arow-name">'+a.name+'</div>'
      +'<div class="arow-ao">AO3 '+f.areas[a.key][2]+'</div>'
      +'<div class="revise">'
      +'<a class="rev-short" href="'+a.short+'" target="_blank" rel="noopener">Short answer &#8599;</a>'
      +'<a class="rev-ext" href="'+a.ext+'" target="_blank" rel="noopener">Extended &#8599;</a>'
      +'</div></div></div>';
  });
  h+='</div>';
  return h;
}

function viewClass(){
  var h=""; var avg=Math.round(mean(state.students.map(overall)));
  var below=state.students.filter(function(x){return overall(x)<70;}).length;
  h+='<div class="cls"><div class="cls-item">'+ring(avg,72,8,"avg")+'<span class="cls-l">class</span></div>'
    +'<div class="cls-stats">'
    +'<div class="cls-s"><strong>'+below+'</strong><span>below target</span></div>'
    +'<div class="cls-s"><strong style="color:'+YEL.txt+'">AO3</strong><span>ceiling</span></div>'
    +'<div class="cls-s"><strong>'+pending().length+'</strong><span>to mark</span></div>'
    +'</div></div>';
  h+='<div class="card">';
  var sorted=state.students.slice().sort(function(a,b){return overall(a)-overall(b);});
  sorted.forEach(function(x){
    h+='<div class="crow">'+ring(overall(x),54,6,"%")
      +'<div class="crow-b"><div class="crow-id">'+x.name+' &middot; '+x.cls+'</div>'
      +'<div class="crow-sub">target '+x.target+' &middot; AO3 '+aoOverall(x,2)+'</div></div>'
      +'<span class="crow-state" style="background:'+stcol(overall(x))+'"></span></div>';
  });
  h+='</div>';
  return h;
}

function viewMark(){
  var h="";
  h+='<div class="lane"><div class="lane-h"><span class="lane-tag" style="background:'+YEL.hi+';color:'+YEL.txt+'">Ongoing &middot; AI</span><span class="lane-w">auto &middot; no staff time</span></div>';
  state.ai.forEach(function(a){ h+='<div class="stream"><span class="s-code">'+a.name+'</span><span class="s-piece">'+a.piece+'</span><span class="s-res">'+a.res+'</span></div>'; });
  h+='</div>';
  h+='<div class="lane"><div class="lane-h"><span class="lane-tag" style="background:'+INK+';color:#fff">High-stakes &middot; You</span><span class="lane-w">anchors the grade</span></div>';
  var p=pending();
  if(p.length===0) h+='<div class="empty">All high-stakes marked.</div>';
  p.forEach(function(o){
    var m=o.m, open=(pickMark===m.id);
    h+='<div class="queue-item"><div class="qi-head"><span class="qi-who">'+o.s.name+' &middot; '+o.s.cls+'</span><span class="qi-q">'+m.q+'</span></div>';
    if(!open){ h+='<button class="qi-btn" onclick="openMark(\''+m.id+'\')">Mark</button>'; }
    else{
      h+='<div class="qi-pred">Predicted '+m.predicted+' &middot; area: '+areaName(m.area)+'</div><div class="levels">';
      [["L4","13-15"],["L3","9-12"],["L2","5-8"],["L1","1-4"]].forEach(function(lv){
        h+='<button class="lvl '+(pickLevel===lv[0]?"on":"")+'" onclick="setLevel(\''+lv[0]+'\')"><span class="lvl-l">'+lv[0]+'</span><span class="lvl-m">'+lv[1]+'</span></button>';
      });
      h+='</div><button class="save" '+(pickLevel?'':'disabled')+' onclick="award()">Save &mdash; moves their rings</button>';
    }
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="lane own"><div class="lane-h"><span class="lane-tag" style="background:'+BLUE.hi+';color:'+BLUE.txt+'">Your own testing</span><span class="lane-w">enter it</span></div>';
  h+='<div class="field"><label>Student</label><div class="chips">';
  state.students.forEach(function(x){ h+='<button class="chip '+(form.stu===x.id?"on":"")+'" onclick="setOwn(\'stu\',\''+x.id+'\')">'+x.name+'</button>'; });
  h+='</div></div>';
  h+='<div class="field"><label>Assessment</label><input id="oName" value="'+(form.name||"")+'" oninput="ownField(\'name\',this.value)" placeholder="e.g. Class test &middot; attribution"></div>';
  h+='<div class="field"><label>Area</label><div class="chips">';
  AREAS.forEach(function(a){ h+='<button class="chip '+(form.area===a.key?"on":"")+'" onclick="setOwn(\'area\',\''+a.key+'\')">'+a.name+'</button>'; });
  h+='</div></div>';
  h+='<div class="field"><label>Score as</label><div class="seg">'
    +'<button class="'+(form.mode==="level"?"on":"")+'" onclick="setOwn(\'mode\',\'level\')">Level</button>'
    +'<button class="'+(form.mode==="mark"?"on":"")+'" onclick="setOwn(\'mode\',\'mark\')">Raw mark</button></div></div>';
  if(form.mode==="level"){
    h+='<div class="chips" style="margin-bottom:12px">';
    ["L1","L2","L3","L4"].forEach(function(l){ h+='<button class="chip lv '+(form.level===l?"on":"")+'" onclick="setOwn(\'level\',\''+l+'\')">'+l+'</button>'; });
    h+='</div>';
  } else {
    h+='<div class="markrow"><input class="mnum" id="oMark" type="number" value="'+(form.mark||"")+'" oninput="ownField(\'mark\',this.value)" placeholder="mark"><span>out of</span><input class="mnum" id="oOut" type="number" value="'+(form.out||"15")+'" oninput="ownField(\'out\',this.value)"></div>';
  }
  h+='<button class="save" onclick="saveOwn()">Save mark &mdash; moves rings</button>';
  if(state.own.length>0){ h+='<div class="ownlog">'; state.own.slice(0,4).forEach(function(e){ h+='<div class="ol"><span>'+e.name+'</span><span>'+e.title+'</span><span>'+e.score+'</span></div>'; }); h+='</div>'; }
  h+='</div>';
  return h;
}

/* ---------- boot ---------- */
state=load(); if(!state){ state=SEED; save(); }
render();
</script>
</body>
</html>
