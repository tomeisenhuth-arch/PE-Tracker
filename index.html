<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A-Level PE — Programme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
<style>
:root{--paper:#EEF1F2;--card:#FFFFFF;--ink:#172029;--muted:#5F6E79;--line:#E3E7EA;--steel:#3E7CB1;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:720px;margin:0 auto;padding:16px;}
.topbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:14px;}
.crest{color:var(--ink);}.dot{width:3px;height:3px;border-radius:50%;background:var(--muted);}
.spacer{flex:1;}.saved{color:#1C8C63;font-weight:700;font-size:12px;}
.logout{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 11px;border-radius:8px;cursor:pointer;}
.roles{display:flex;gap:3px;background:#E3E7EA;border-radius:9px;padding:3px;}
.roles button{border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 14px;border-radius:7px;cursor:pointer;}
.roles button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
/* login */
.login{max-width:400px;margin:6vh auto 0;}
.login-h{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:22px;margin:0 0 4px;}
.login-s{color:var(--muted);font-size:13px;margin:0 0 22px;}
.seg{display:flex;background:#E3E7EA;border-radius:10px;padding:4px;margin-bottom:18px;}
.seg button{flex:1;border:0;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:9px;border-radius:8px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.field{margin-bottom:14px;}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:15px;background:#fff;}
.field input:focus,.field select:focus{outline:none;border-color:var(--steel);}
.gbtns{display:flex;gap:8px;}
.gbtns button{flex:1;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:10px;border-radius:10px;cursor:pointer;}
.gbtns button.on{border-color:var(--ink);color:var(--ink);background:#F7F9FA;}
.remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:6px 0 16px;cursor:pointer;}
.remember input{width:16px;height:16px;}
.go{width:100%;border:0;background:var(--ink);color:#fff;font-family:inherit;font-size:14px;font-weight:700;padding:13px;border-radius:10px;cursor:pointer;}
.go:disabled{opacity:.5;}
.err{background:#FBF3EE;border:1px solid #F0DDD0;color:#8F332C;font-size:12.5px;border-radius:9px;padding:11px;margin-top:12px;line-height:1.5;}
.loading{padding:40px;text-align:center;color:var(--muted);}
/* shared cards */
.hero{background:linear-gradient(135deg,#141C24,#1F2C36);color:#EDF1F3;border-radius:16px;padding:22px;margin-bottom:12px;}
.hh-name{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:15px;color:#8FA3B0;margin-bottom:4px;}
.hh-line{font-size:18px;font-weight:500;}.hh-line strong{font-family:'Archivo Expanded',sans-serif;font-weight:800;}.star{color:#7FD3AD;}
.gradebar{margin:18px 0 2px;}.gb-track{position:relative;height:12px;background:rgba(255,255,255,.12);border-radius:6px;}
.gb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#3E7CB1,#5FA8D8);transition:width .5s;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
.card-h{font-weight:700;font-size:15px;margin-bottom:14px;}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring-c{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;}
.ring-v{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:17px;}.ring-s{font-size:9px;color:var(--muted);font-weight:600;margin-top:1px;}
.aob{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.aob-tag{font-family:'Archivo Expanded',sans-serif;font-weight:700;font-size:11px;padding:3px 8px;border-radius:5px;width:44px;text-align:center;}
.aob-lab{font-size:12.5px;font-weight:600;color:var(--muted);width:82px;}
.aob-bar{flex:1;height:9px;background:#EDF0F2;border-radius:5px;overflow:hidden;}.aob-bar > div{height:100%;border-radius:5px;transition:width .5s;}
.aob-v{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:14px;width:24px;text-align:right;}
.mk-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px;}
.mk-row strong{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:16px;}
.mk-row.hi{background:#FBEDB0;margin:0 -10px;padding:8px 10px;border-radius:8px;}
.refl p{font-size:12.5px;margin:0 0 8px;}
.refl textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;}
.refl textarea:focus{outline:none;border-color:var(--steel);}
.refl button{margin-top:8px;border:0;background:var(--ink);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;}
.refl button:disabled{opacity:.4;}
.refl-done{font-size:12.5px;line-height:1.5;background:#F1F6F4;border:1px solid #D3E4DC;border-radius:9px;padding:12px;color:#15694A;}
.arow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
.arow:first-of-type{border-top:0;}
.arow-mid{flex:1;}.arow-name{font-size:14px;font-weight:700;}.arow-ao{font-size:11.5px;color:var(--muted);margin-top:2px;}
.revise{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.revise a{font-size:11.5px;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:7px;border:1px solid;}
.rev-short{color:#2E6C9E;border-color:#CBE3F5;background:#F3F8FC;}
.rev-ext{color:#9A7A16;border-color:#F0E2A8;background:#FCF7E3;}
.cls{background:#141C24;color:#EDF1F3;border-radius:14px;padding:18px;display:flex;align-items:center;gap:20px;margin-bottom:12px;}
.cls-item{display:flex;flex-direction:column;align-items:center;gap:6px;}.cls-l{font-size:11px;color:#8FA3B0;font-weight:600;}
.cls-stats{display:flex;flex:1;justify-content:space-around;}.cls-s{text-align:center;}
.cls-s strong{display:block;font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:24px;}.cls-s span{font-size:11px;color:#8FA3B0;font-weight:600;}
.gfilter{display:flex;gap:6px;margin-bottom:10px;}
.gfilter button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:16px;cursor:pointer;}
.gfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.crow{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;}.crow:first-of-type{border-top:0;}
.crow-b{flex:1;}.crow-id{font-size:13.5px;font-weight:700;}.crow-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.crow-state{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.chev{color:var(--muted);font-size:18px;}
.back{border:0;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--steel);cursor:pointer;padding:0;margin-bottom:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:#EDF0F2;border:0;border-radius:16px;padding:6px 12px;cursor:pointer;font-family:inherit;}
.chip.on{background:var(--ink);color:#fff;}.chip.lv{width:50px;text-align:center;font-family:'Archivo Expanded',sans-serif;font-weight:800;}
.mseg{display:inline-flex;background:#E3E7EA;border-radius:9px;padding:3px;}
.mseg button{border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 14px;border-radius:7px;cursor:pointer;}
.mseg button.on{background:#fff;color:var(--ink);}
.markrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted);}.mnum{width:80px !important;}
.save{width:100%;border:0;background:#1C8C63;color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:11px;border-radius:9px;cursor:pointer;}
.save:disabled{opacity:.45;}
.toast{background:#F1F6F4;border:1px solid #D3E4DC;border-radius:9px;padding:11px;font-size:12.5px;color:#15694A;font-weight:600;margin-top:12px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
/* ================= CONFIG ================= */
var SUPA_URL = "https://emrnfuomwdiyyrohczpr.supabase.co";
var SUPA_KEY = "sb_publishable_Kx-oJE9vPNUdYAnkY6KFrA_D-tGKeUO";
var SESSION_KEY = "pe-session-v2";

var BASEURL = "https://tomeisenhuth-arch.github.io/Revision-2026/";
var AREAS = [
  { key:"skill", name:"Skill Acquisition", short:BASEURL+"SkillAcquisitionEC.html", ext:BASEURL+"SkillAcquisitionExtended%20(1).html" },
  { key:"psych", name:"Sport Psychology", short:BASEURL+"SportPsychologyEC.html", ext:BASEURL+"SportPsychologyExtended.html" },
  { key:"physbio", name:"Physiology & Biomechanics", short:BASEURL+"PhysiologyBiomechanicsEC.html", ext:BASEURL+"PhysiologyExtended.html" },
  { key:"socio", name:"Sociology of Sport", short:BASEURL+"SociologyEC.html", ext:BASEURL+"SociologyExtended.html" }
];
function areaName(k){ for(var i=0;i<AREAS.length;i++){ if(AREAS[i].key===k) return AREAS[i].name; } return k; }
var PINK={hi:"#FBD0E0",sol:"#CF5E8C",txt:"#B0396A"}, BLUE={hi:"#CBE3F5",sol:"#4E8FC0",txt:"#2E6C9E"}, YEL={hi:"#FBEDB0",sol:"#D6A82A",txt:"#9A7A16"};
var GREEN="#1C8C63",INK="#172029";
var LVL={L1:28,L2:48,L3:64,L4:86};
function stcol(v){ return v>=73?GREEN:(v>=60?"#C58A1E":"#C0463E"); }
function clamp(v){ return Math.max(20,Math.min(96,Math.round(v))); }
function blend(o,val,w){ return clamp(o*(1-w)+val*w); }
function mean(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
function areaPct(a){ return Math.round(mean(a)); }
function overall(s){ return Math.round(mean(AREAS.map(function(a){return areaPct(s.areas[a.key]);}))); }
function aoOverall(s,i){ return Math.round(mean(AREAS.map(function(a){return s.areas[a.key][i];}))); }

/* ================= SUPABASE RPC ================= */
async function rpc(fn, params){
  var res = await fetch(SUPA_URL+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(params||{})
  });
  if(!res.ok){ var t=await res.text(); throw new Error(fn+" "+res.status+" "+t); }
  var txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* ================= STATE ================= */
var S = {
  session:null, me:null, roster:null, cohort:null,
  viewId:null, tab:"class", loginRole:"student", loginGroup:"2026A", loginName:"",
  gfilter:"All", busy:false, err:"", toast:"",
  mArea:"psych", mName:"", mStakes:"high", mMode:"level", mLevel:null, mMark:"", mOut:"15",
  remember:true
};

/* ================= ACTIONS ================= */
function setEl(id,v){ var e=document.getElementById(id); if(e) e[v!==undefined?'value':'value']=v; }
function val(id){ var e=document.getElementById(id); return e?e.value:""; }

async function loadRoster(){
  try{ S.roster = await rpc("roster",{}); render(); }
  catch(e){ S.err="Couldn't load the class list — check your connection and reload."; render(); }
}
async function refresh(){
  if(!S.session) return;
  if(S.session.role==="student"){
    var rows = await rpc("student_login",{p_id:S.session.id, p_pin:S.session.pin});
    if(rows&&rows.length){ S.me=rows[0]; } else { logout(); }
  } else {
    S.cohort = await rpc("teacher_students",{p_pass:S.session.pass});
  }
}
function setLoginRole(r){ S.loginRole=r; S.err=""; render(); }
function setLoginGroup(g){ S.loginGroup=g; S.loginName=""; render(); }
function onName(v){ S.loginName=v; }
function toggleRemember(){ S.remember=!S.remember; render(); }

async function studentLogin(){
  var pin = val("pinInput");
  if(!S.loginName){ S.err="Pick your name first."; render(); return; }
  if(!pin){ S.err="Enter your PIN."; render(); return; }
  S.busy=true; S.err=""; render();
  try{
    var rows = await rpc("student_login",{p_id:S.loginName, p_pin:pin});
    if(rows && rows.length){
      S.session={role:"student", id:S.loginName, pin:pin};
      S.me=rows[0];
      if(S.remember) localStorage.setItem(SESSION_KEY, JSON.stringify(S.session));
    } else { S.err="That PIN doesn't match. Try again."; }
  }catch(e){ S.err="Couldn't reach the server. Check your connection and try again."; }
  S.busy=false; render();
}
async function teacherLogin(){
  var pass = val("passInput");
  if(!pass){ S.err="Enter your teacher password."; render(); return; }
  S.busy=true; S.err=""; render();
  try{
    var ok = await rpc("teacher_check",{p_pass:pass});
    if(ok===true){
      S.session={role:"teacher", pass:pass};
      S.cohort = await rpc("teacher_students",{p_pass:pass});
      S.tab="class"; S.viewId=null;
      if(S.remember) localStorage.setItem(SESSION_KEY, JSON.stringify(S.session));
    } else { S.err="That password isn't recognised."; }
  }catch(e){ S.err="Couldn't reach the server. Check your connection and try again."; }
  S.busy=false; render();
}
function logout(){ S.session=null; S.me=null; S.cohort=null; S.viewId=null; localStorage.removeItem(SESSION_KEY); if(!S.roster) loadRoster(); render(); }

function setTab(t){ S.tab=t; S.viewId=null; render(); }
function openStudent(id){ S.viewId=id; render(); }
function backToClass(){ S.viewId=null; render(); }
function setGfilter(g){ S.gfilter=g; render(); }

/* mark form */
function setMField(k,v){ S["m"+k]=v; render(); }
function inMField(k,v){ S["m"+k]=v; }
async function saveMark(){
  var stuId = val("mStu"); S.mName = val("mName"); if(document.getElementById("mMark")) S.mMark=val("mMark"); if(document.getElementById("mOut")) S.mOut=val("mOut");
  if(!stuId){ S.err="Pick a student."; render(); return; }
  if(!S.mName.trim()){ S.err="Name the assessment."; render(); return; }
  if(S.mMode==="level" ? !S.mLevel : S.mMark===""){ S.err="Enter a level or a mark."; render(); return; }
  var stu=null; for(var i=0;i<S.cohort.length;i++){ if(S.cohort[i].id===stuId) stu=S.cohort[i]; }
  var areas = JSON.parse(JSON.stringify(stu.areas));
  var a = areas[S.mArea];
  var scoreLabel;
  if(S.mMode==="level"){ a[2]=blend(a[2], LVL[S.mLevel], S.mStakes==="high"?0.6:0.4); scoreLabel=S.mLevel; }
  else { var pct=clamp((+S.mMark/+S.mOut)*100); a[0]=blend(a[0],pct,0.35); a[1]=blend(a[1],pct,0.35); a[2]=blend(a[2],pct,0.35); scoreLabel=S.mMark+"/"+S.mOut; }
  var marks = (stu.marks||[]).slice();
  marks.unshift({ id:"m"+Date.now(), area:S.mArea, title:S.mName.trim(), stakes:S.mStakes, score:scoreLabel, reflection:"", date:new Date().toISOString().slice(0,10) });
  S.busy=true; render();
  try{
    await rpc("teacher_save",{ p_pass:S.session.pass, p_id:stuId, p_areas:areas, p_marks:marks });
    stu.areas=areas; stu.marks=marks;
    S.toast="Saved to "+stu.name+" — their rings updated.";
    S.mName=""; S.mLevel=null; S.mMark="";
    setTimeout(function(){ S.toast=""; render(); }, 2600);
  }catch(e){ S.err="Save failed — check your connection and try again."; }
  S.busy=false; render();
}

/* student reflection */
async function saveReflection(markId){
  var el=document.getElementById("reflInput"); var text=el?el.value:"";
  var marks = S.me.marks.slice();
  for(var i=0;i<marks.length;i++){ if(marks[i].id===markId) marks[i].reflection=text; }
  S.busy=true; render();
  try{
    await rpc("student_save",{ p_id:S.session.id, p_pin:S.session.pin, p_marks:marks });
    S.me.marks=marks;
  }catch(e){ S.err="Couldn't save your reflection — check your connection."; }
  S.busy=false; render();
}

/* ================= RENDER ================= */
function ring(pct,size,stroke,sub){
  var r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100), col=stcol(pct);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#EAEEF0" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset .5s"/>'
    +'</svg><div class="ring-c"><span class="ring-v">'+pct+'</span>'+(sub?'<span class="ring-s">'+sub+'</span>':'')+'</div></div>';
}

function render(){
  var h="";
  if(!S.session){ h=renderLogin(); }
  else if(S.session.role==="student"){ h=renderShellStudent()+renderMe(S.me,true); }
  else { h=renderShellTeacher()+(S.viewId?renderStudentDetail():(S.tab==="class"?renderClass():renderMark())); }
  document.getElementById("app").innerHTML=h;
}

function renderLogin(){
  var h='<div class="login"><div class="login-h">A-Level PE</div><div class="login-s">Elizabeth College · sign in to your area</div>';
  h+='<div class="seg"><button class="'+(S.loginRole==="student"?"on":"")+'" onclick="setLoginRole(\'student\')">Student</button><button class="'+(S.loginRole==="teacher"?"on":"")+'" onclick="setLoginRole(\'teacher\')">Teacher</button></div>';
  if(S.loginRole==="student"){
    h+='<div class="field"><label>Your group</label><div class="gbtns">'
      +'<button class="'+(S.loginGroup==="2026A"?"on":"")+'" onclick="setLoginGroup(\'2026A\')">2026A</button>'
      +'<button class="'+(S.loginGroup==="2025A"?"on":"")+'" onclick="setLoginGroup(\'2025A\')">2025A</button></div></div>';
    h+='<div class="field"><label>Your name</label><select id="nameSel" onchange="onName(this.value)">';
    if(!S.roster){ h+='<option>Loading names…</option>'; }
    else {
      h+='<option value="">Choose…</option>';
      S.roster.filter(function(r){return r.grp===S.loginGroup;}).forEach(function(r){
        h+='<option value="'+r.id+'"'+(S.loginName===r.id?" selected":"")+'>'+r.name+'</option>';
      });
    }
    h+='</select></div>';
    h+='<div class="field"><label>Your PIN</label><input id="pinInput" type="password" inputmode="numeric" placeholder="4 digits" /></div>';
    h+='<label class="remember"><input type="checkbox" '+(S.remember?"checked":"")+' onchange="toggleRemember()"> Keep me signed in on this device</label>';
    h+='<button class="go" '+(S.busy?"disabled":"")+' onclick="studentLogin()">'+(S.busy?"Signing in…":"Sign in")+'</button>';
  } else {
    h+='<div class="field"><label>Teacher password</label><input id="passInput" type="password" placeholder="your password" /></div>';
    h+='<label class="remember"><input type="checkbox" '+(S.remember?"checked":"")+' onchange="toggleRemember()"> Keep me signed in on this device</label>';
    h+='<button class="go" '+(S.busy?"disabled":"")+' onclick="teacherLogin()">'+(S.busy?"Signing in…":"Sign in")+'</button>';
  }
  if(S.err) h+='<div class="err">'+S.err+'</div>';
  h+='</div>';
  return h;
}

function renderShellStudent(){
  return '<div class="topbar"><span class="crest">Elizabeth College</span><span class="dot"></span><span>A-Level PE</span><span class="spacer"></span>'
    +(S.busy?'<span class="saved">Saving…</span>':'')+'<button class="logout" onclick="logout()">Sign out</button></div>';
}
function renderShellTeacher(){
  return '<div class="topbar"><span class="crest">Elizabeth College</span><span class="dot"></span><span>A-Level PE · staff</span><span class="spacer"></span>'
    +(S.busy?'<span class="saved">Saving…</span>':'')
    +'<div class="roles"><button class="'+(S.tab==="class"&&!S.viewId?"on":"")+'" onclick="setTab(\'class\')">Class</button><button class="'+(S.tab==="mark"?"on":"")+'" onclick="setTab(\'mark\')">Mark</button></div>'
    +'<button class="logout" style="margin-left:6px" onclick="logout()">Sign out</button></div>';
}

function renderMe(rec, editable){
  if(!rec) return '<div class="loading">Loading…</div>';
  var h='<div class="hero"><div class="hh-name">'+rec.name+' &middot; '+rec.grp+'</div>'
    +'<div class="hh-line">Tracking to <strong class="star">'+rec.target+'</strong> &middot; overall '+overall(rec)+'%</div>'
    +'<div class="gradebar"><div class="gb-track"><div class="gb-fill" style="width:'+overall(rec)+'%"></div></div></div></div>';
  var aos=[["AO1","Knowledge",PINK,0],["AO2","Application",BLUE,1],["AO3","Evaluation",YEL,2]];
  h+='<div class="card"><div class="card-h">Three objectives</div>';
  aos.forEach(function(a){
    h+='<div class="aob"><span class="aob-tag" style="background:'+a[2].hi+';color:'+a[2].txt+'">'+a[0]+'</span>'
      +'<span class="aob-lab">'+a[1]+'</span><div class="aob-bar"><div style="width:'+aoOverall(rec,a[3])+'%;background:'+a[2].sol+'"></div></div>'
      +'<span class="aob-v">'+aoOverall(rec,a[3])+'</span></div>';
  });
  h+='</div>';
  (rec.marks||[]).forEach(function(m){
    h+='<div class="card"><div class="card-h">'+m.title+'</div>'
      +'<div class="mk-row hi"><span>'+(m.stakes==="high"?"High-stakes":"Assessment")+' &middot; marked</span><strong>'+m.score+'</strong></div>';
    if(m.reflection){ h+='<div class="refl-done"><strong>Reflection:</strong> '+m.reflection+'</div>'; }
    else if(editable){ h+='<div class="refl"><p>What will you change to get more yellow next time?</p><textarea id="reflInput" rows="2" placeholder="Next time I will&hellip;"></textarea><button '+(S.busy?"disabled":"")+' onclick="saveReflection(\''+m.id+'\')">Save reflection</button></div>'; }
    else { h+='<div class="refl-done" style="color:#5F6E79;background:#F7F9FA;border-color:#E3E7EA">No reflection yet.</div>'; }
    h+='</div>';
  });
  h+='<div class="card"><div class="card-h">Four areas &middot; tap a tutor to revise</div>';
  AREAS.forEach(function(a){
    h+='<div class="arow">'+ring(areaPct(rec.areas[a.key]),58,7,"%")+'<div class="arow-mid"><div class="arow-name">'+a.name+'</div>'
      +'<div class="arow-ao">AO3 '+rec.areas[a.key][2]+'</div><div class="revise">'
      +'<a class="rev-short" href="'+a.short+'" target="_blank" rel="noopener">Short answer &#8599;</a>'
      +'<a class="rev-ext" href="'+a.ext+'" target="_blank" rel="noopener">Extended &#8599;</a></div></div></div>';
  });
  h+='</div>';
  if(S.err) h+='<div class="err">'+S.err+'</div>';
  return h;
}

function renderClass(){
  if(!S.cohort) return '<div class="loading">Loading class…</div>';
  var list = S.gfilter==="All"?S.cohort:S.cohort.filter(function(x){return x.grp===S.gfilter;});
  var avg = list.length?Math.round(mean(list.map(overall))):0;
  var below = list.filter(function(x){return overall(x)<70;}).length;
  var h='<div class="cls"><div class="cls-item">'+ring(avg,72,8,"avg")+'<span class="cls-l">'+(S.gfilter==="All"?"cohort":S.gfilter)+'</span></div>'
    +'<div class="cls-stats"><div class="cls-s"><strong>'+list.length+'</strong><span>students</span></div>'
    +'<div class="cls-s"><strong>'+below+'</strong><span>below target</span></div>'
    +'<div class="cls-s"><strong style="color:'+YEL.txt+'">AO3</strong><span>watch</span></div></div></div>';
  h+='<div class="gfilter">';
  ["All","2026A","2025A"].forEach(function(g){ h+='<button class="'+(S.gfilter===g?"on":"")+'" onclick="setGfilter(\''+g+'\')">'+g+'</button>'; });
  h+='</div><div class="card">';
  list.slice().sort(function(a,b){return overall(a)-overall(b);}).forEach(function(x){
    h+='<div class="crow" onclick="openStudent(\''+x.id+'\')">'+ring(overall(x),54,6,"%")
      +'<div class="crow-b"><div class="crow-id">'+x.name+' &middot; '+x.grp+'</div><div class="crow-sub">target '+x.target+' &middot; AO3 '+aoOverall(x,2)+'</div></div>'
      +'<span class="chev">&#8250;</span></div>';
  });
  h+='</div>';
  return h;
}

function renderStudentDetail(){
  var rec=null; for(var i=0;i<S.cohort.length;i++){ if(S.cohort[i].id===S.viewId) rec=S.cohort[i]; }
  return '<button class="back" onclick="backToClass()">&#8249; Back to class</button>'+renderMe(rec,false);
}

function renderMark(){
  if(!S.cohort) return '<div class="loading">Loading…</div>';
  var h='<div class="card"><div class="card-h">Enter a mark</div>';
  // student select grouped
  h+='<div class="field" style="margin-bottom:12px"><label>Student</label><select id="mStu"><option value="">Choose…</option>';
  ["2026A","2025A"].forEach(function(g){
    h+='<optgroup label="'+g+'">';
    S.cohort.filter(function(x){return x.grp===g;}).forEach(function(x){ h+='<option value="'+x.id+'">'+x.name+'</option>'; });
    h+='</optgroup>';
  });
  h+='</select></div>';
  h+='<div class="field" style="margin-bottom:12px"><label>Assessment</label><input id="mName" value="'+(S.mName||"")+'" oninput="inMField(\'Name\',this.value)" placeholder="e.g. Mock Paper 2 &middot; attribution" /></div>';
  h+='<label style="display:block;font-size:11px;font-weight:700;color:#5F6E79;margin-bottom:7px">Area</label><div class="chips" style="margin-bottom:12px">';
  AREAS.forEach(function(a){ h+='<button class="chip '+(S.mArea===a.key?"on":"")+'" onclick="setMField(\'Area\',\''+a.key+'\')">'+a.name+'</button>'; });
  h+='</div>';
  h+='<label style="display:block;font-size:11px;font-weight:700;color:#5F6E79;margin-bottom:7px">Stakes</label><div class="mseg" style="margin-bottom:14px"><button class="'+(S.mStakes==="high"?"on":"")+'" onclick="setMField(\'Stakes\',\'high\')">High-stakes</button><button class="'+(S.mStakes==="own"?"on":"")+'" onclick="setMField(\'Stakes\',\'own\')">Own test</button></div>';
  h+='<label style="display:block;font-size:11px;font-weight:700;color:#5F6E79;margin-bottom:7px">Score as</label><div class="mseg" style="margin-bottom:12px"><button class="'+(S.mMode==="level"?"on":"")+'" onclick="setMField(\'Mode\',\'level\')">Level</button><button class="'+(S.mMode==="mark"?"on":"")+'" onclick="setMField(\'Mode\',\'mark\')">Raw mark</button></div>';
  if(S.mMode==="level"){
    h+='<div class="chips" style="margin-bottom:14px">';
    ["L1","L2","L3","L4"].forEach(function(l){ h+='<button class="chip lv '+(S.mLevel===l?"on":"")+'" onclick="setMField(\'Level\',\''+l+'\')">'+l+'</button>'; });
    h+='</div>';
  } else {
    h+='<div class="markrow"><input class="mnum" id="mMark" type="number" value="'+(S.mMark||"")+'" oninput="inMField(\'Mark\',this.value)" placeholder="mark"><span>out of</span><input class="mnum" id="mOut" type="number" value="'+(S.mOut||"15")+'" oninput="inMField(\'Out\',this.value)"></div>';
  }
  h+='<button class="save" '+(S.busy?"disabled":"")+' onclick="saveMark()">Save mark &mdash; syncs to their device</button>';
  if(S.toast) h+='<div class="toast">'+S.toast+'</div>';
  if(S.err) h+='<div class="err">'+S.err+'</div>';
  h+='</div>';
  return h;
}

/* ================= BOOT ================= */
(async function boot(){
  render();
  var saved=null; try{ saved=JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){}
  if(saved){
    S.session=saved;
    try{ await refresh(); }catch(e){ S.session=null; localStorage.removeItem(SESSION_KEY); }
  }
  if(!S.session){ loadRoster(); }
  render();
})();
</script>
</body>
</html>
